name: Deploy Function App (prod)

# Manual-only on purpose: prod should never deploy as a side effect of a dev push
# (matches infra-lot-scanner's deploy-infrastructure-prod.yml). Code-only deploy --
# infra-lot-scanner owns provisioning and app settings.
#
# lot-scanner-func-prod runs on Flex Consumption (Linux) as of 2026-11-24, after
# Windows Consumption's host runtime proved unable to reliably specialize .NET 9/10
# isolated-worker apps on this subscription's scale unit. Flex Consumption uses a
# different deployment model than classic zip-deploy: az functionapp deployment
# source config-zip and even az functionapp deploy / Azure/functions-action were all
# confirmed to silently no-op against it (the function list stayed stuck on the
# system WarmUp placeholder). Azure Functions Core Tools (func azure functionapp
# publish) is the only method confirmed to actually work here.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to deploy'
        required: false
        default: 'master'

concurrency:
  group: deploy-function-app-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'master' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Restore (linux-x64)
        run: dotnet restore fn-lot-scanner.csproj --runtime linux-x64

      - name: Build
        run: dotnet build fn-lot-scanner.csproj --configuration Release --no-restore

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publish with Azure Functions Core Tools
        run: func azure functionapp publish lot-scanner-func-prod --dotnet-isolated

      - name: Deployment Complete
        run: |
          echo "fn-lot-scanner deployed to prod successfully!"
          echo "URL: https://lot-scanner-func-prod.azurewebsites.net"
